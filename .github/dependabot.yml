# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'npm'
    open-pull-requests-limit: 5
    groups:
      # Deliberately includes majors. wrangler, miniflare and vitest-pool-workers
      # interlock, and vitest-pool-workers peer-depends on an exact vitest minor,
      # so splitting their majors apart produces PRs that are individually broken
      # and cannot go green on their own.
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/*'
          - 'vitest'
          - '@vitest/*'
      # Independent tools, so majors are held out and arrive as their own PR where
      # the changelog can be read before merging. typescript 5 -> 7 swapped in the
      # native port and dropped tsserver; that deserved its own review.
      tooling:
        patterns:
          - 'prettier'
          - 'typescript'
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types:
          - 'minor'
          - 'patch'
    # hono is the only runtime dependency and is left ungrouped so every update to
    # it gets reviewed on its own.

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'github-actions'
    open-pull-requests-limit: 3
    groups:
      # Action majors are low-risk here and fully exercised by the workflow itself,
      # so they stay grouped.
      actions:
        patterns:
          - '*'
